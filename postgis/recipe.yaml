schema_version: 1

context:
  version: "3.6.2"

package:
  name: postgis
  version: ${{ version }}

source:
  url: https://github.com/postgis/postgis/archive/${{ version }}.tar.gz
  sha256: 607a4d21c017e5283e15d2d977c9b7f575ddfc672afdee81fc84a2d823db4ba5

build:
  number: 0

requirements:
  build:
    - if: win
      then:
        - autotools_clang_conda
        # clang 22 reorganized its x86 intrinsic headers: immintrin.h now
        # includes mmintrin.h unconditionally (the __MMX__ include guard was
        # removed), and that header fails to compile in C++ when MMX is
        # disabled. The MSVC STL drags it in via <algorithm> -> ... ->
        # wchar.h -> intrin.h, so the -mno-mmx workaround in build.sh no
        # longer helps. Pin to clang 21, which honors -mno-mmx and is the
        # toolchain this recipe is built/tested against.
        - clang <22
        - clangxx <22
    - if: not win
      then:
        - ${{ compiler('c') }}        
        - ${{ stdlib("c") }}
        - ${{ compiler('cxx') }}
        - autoconf
        - automake
        - libtool
        - make
        - perl 5.*
        - libxslt
        - gettext-tools
    - pkg-config
  host:
    - cunit
    - libgdal-core
    - geos
    - pcre2
    - proj
    - json-c
    - postgresql
    - libiconv
    - libpq
    - libxml2-devel
    - liblzma-devel
    - if: win
      then:
        - sqlite
  run:
    - postgresql

tests:
  - files:
      recipe:
        - test_data
    script:
      - shp2pgsql test_data/test.shp
      - pgsql2shp
      - raster2pgsql

about:
  license: GPL-2.0-or-later
  license_file: LICENSE.TXT
  summary: PostGIS adds geometry, geography, raster and other types to the PostgreSQL database.
  description: |
    PostGIS is a spatial database extender for PostgreSQL object-relational
    database. It adds support for geographic objects allowing location
    queries to be run in SQL.
  homepage: http://postgis.net
  repository: https://git.osgeo.org/gitea/postgis/postgis
  documentation: http://postgis.net/documentation/

extra:
  recipe-maintainers:
    - sodre
    - dwnoble
    - xylar
    - mxr-conda
