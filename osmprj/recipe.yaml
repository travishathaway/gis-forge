schema_version: 1

context:
  name: osmprj
  version: "0.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://github.com/travishathaway/osmprj/archive/refs/tags/${{ version }}.tar.gz
    sha256: 54bb83067b147f0dfdfdb6160989e89b2c75d785c3e26c9651f2263570f575c6

build:
  number: 0

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
  run:
    - osm2pgsql
    - osm2pgsql-themepark
    - pgosm-themepark
    - psycopg
    - pyosmium

tests:
  - script:
      - osmprj --help
      - osmprj init

about:
  homepage: https://github.com/travishathaway/osmprj
  summary: OpenStreetMap and PostgreSQL project management tool
  repository: https://github.com/travishathaway/osmprj
  license: GPL-3.0-only
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - travishathaway
