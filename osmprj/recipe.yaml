schema_version: 1

context:
  name: osmprj
  version: "0.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://github.com/travishathaway/osmprj/archive/refs/tags/${{ version }}.tar.gz
    sha256: b0c72202c1f5c0f19d10d39e81a642d4354baf40f1529b1c400a214585f31a78

build:
  number: 0

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
  run:
    - osm2pgsql
    - osm2pgsql-themepark
    - pgosm-themepark
    - psycopg
    - pyosmium

tests:
  - script:
      - osmprj --help
      - osmprj init

about:
  homepage: https://github.com/travishathaway/osmprj
  summary: OpenStreetMap and PostgreSQL project management tool
  repository: https://github.com/travishathaway/osmprj
  license: GPL-3.0-only
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - travishathaway
